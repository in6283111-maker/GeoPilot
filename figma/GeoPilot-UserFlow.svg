<svg xmlns="http://www.w3.org/2000/svg" width="2020" height="760" viewBox="0 0 2020 760"><rect x="0" y="0" width="2020" height="760" rx="0" fill="#F4F7F3" stroke="none"/><text x="50" y="71" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#173C31">GeoPilot / Карта пути пользователя</text><text x="50" y="112" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#65796F">Найти интересное место в области Жетісу и открыть маршрут</text><rect x="50" y="180" width="300" height="164" rx="20" fill="white" stroke="#DAE5DC"/><text x="70" y="213" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#21684C">01</text><text x="70" y="251" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#173C31">Главная — карта</text><text x="70" y="288" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">GPS или выбор точки</text><text x="70" y="311" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">Места поблизости</text><text x="370" y="255" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="400" fill="#21684C">→</text><text x="353" y="293" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#65796F">Спросить ИИ</text><rect x="440" y="180" width="300" height="164" rx="20" fill="white" stroke="#DAE5DC"/><text x="460" y="213" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#21684C">02</text><text x="460" y="251" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#173C31">ИИ-помощник</text><text x="460" y="288" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">Запрос и интересы</text><text x="460" y="311" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">Время на поездку</text><text x="760" y="255" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="400" fill="#21684C">→</text><text x="743" y="293" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#65796F">Подобрать</text><rect x="830" y="180" width="300" height="164" rx="20" fill="white" stroke="#DAE5DC"/><text x="850" y="213" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#21684C">03</text><text x="850" y="251" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#173C31">Результаты поиска</text><text x="850" y="288" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">Рекомендации из каталога</text><text x="850" y="311" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">Выбор подходящего места</text><text x="1150" y="255" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="400" fill="#21684C">→</text><text x="1133" y="293" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#65796F">Выбрать</text><rect x="1220" y="180" width="300" height="164" rx="20" fill="white" stroke="#DAE5DC"/><text x="1240" y="213" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#21684C">04</text><text x="1240" y="251" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#173C31">Карточка места</text><text x="1240" y="288" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">Описание и условия</text><text x="1240" y="311" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">Кнопка маршрута</text><text x="1540" y="255" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="400" fill="#21684C">→</text><text x="1523" y="293" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#65796F">Маршрут</text><rect x="1610" y="180" width="300" height="164" rx="20" fill="#21684C" stroke="#DAE5DC"/><text x="1630" y="213" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="white">05</text><text x="1630" y="251" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="white">Маршрут</text><text x="1630" y="288" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="white">Внешний сервис карт</text><text x="1630" y="311" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="white">Путь до выбранного места</text><path d="M 200 356 L 200 405" stroke="#65796F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 194 398 L 200 405 L 206 398" stroke="#65796F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="423" width="300" height="120" rx="16" fill="#E4EEDC" stroke="none"/><text x="70" y="458" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#173C31">GPS недоступен</text><text x="70" y="489" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">Выбрать точку вручную</text><text x="70" y="510" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">и продолжить поиск</text><path d="M 590 356 L 590 405" stroke="#65796F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 584 398 L 590 405 L 596 398" stroke="#65796F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="440" y="423" width="300" height="120" rx="16" fill="#E4EEDC" stroke="none"/><text x="460" y="458" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#173C31">Нет интернета</text><text x="460" y="489" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">Показать сообщение</text><text x="460" y="510" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">и кнопку «Повторить»</text><path d="M 980 356 L 980 405" stroke="#65796F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 974 398 L 980 405 L 986 398" stroke="#65796F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="830" y="423" width="300" height="120" rx="16" fill="#E4EEDC" stroke="none"/><text x="850" y="458" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#173C31">Нет результатов</text><text x="850" y="489" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">Изменить запрос</text><text x="850" y="510" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#65796F">или расширить область поиска</text><path d="M 1370 359 L 1370 584 L 980 584 L 980 359" stroke="#21684C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 974 367 L 980 359 L 986 367" stroke="#21684C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1020" y="611" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#21684C">Вернуться к результатам</text><text x="50" y="688" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#65796F">Основной путь — 5 экранов. Дополнительные ветки помогают продолжить сценарий при ошибках.</text><text x="50" y="721" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#65796F">Маршрут → карточка места: возврат в GeoPilot. Регистрация для основного сценария не требуется.</text></svg>